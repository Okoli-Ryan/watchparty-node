# WatchParty API on the VPS (or on your machine), running a prebuilt image.
# Nothing is built here. The deploy script sets WATCHPARTY_IMAGE, e.g.
#   WATCHPARTY_IMAGE=ghcr.io/<owner>/<repo>:<commit-sha> docker compose up -d
#
# Settings come from .env next to this file (see .env.example). It stays on the machine
# and a deployment never overwrites it.
#
# Postgres is external (Neon): DATABASE_URL points at it. The API applies its migrations
# itself on start.
#
# The API is published on the loopback interface only. Put a reverse proxy (Caddy) in
# front for HTTPS.

name: watchparty

services:
  api:
    image: ${WATCHPARTY_IMAGE:?set WATCHPARTY_IMAGE, for example ghcr.io/owner/watchparty-node:latest}
    container_name: watchparty-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WATCHPARTY_PORT:-8081}:8080"
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env, e.g. https://dashboard.example.com}
      # One reverse proxy (Caddy) in front. Safe because the port is loopback-only.
      # Without it every client looks like 127.0.0.1 and shares one rate limit.
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Telemetry over OTLP/HTTP. Empty endpoint = nothing is exported.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: watchparty-api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
